name: Checks

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Native tests and vet
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows package (publication remains gated)
        shell: pwsh
        run: ./scripts/release/build-windows.ps1 -Version v0.4.0-ci -SkipChecks
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test and check
        run: |
          make test
          make check
      - name: Build
        run: make build
      - name: Replay synthetic hooks
        run: python3 scripts/dev/verify_tool_hooks.py --binary bin/laodi --output /tmp/laodi-hook-results.json
      - name: Verify command-line bootstrap
        run: python3 scripts/dev/verify_bootstrap.py --output /tmp/laodi-bootstrap-results.json
